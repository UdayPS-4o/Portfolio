# Portfolio stack for Dokploy — SAME-ORIGIN routing.
#
#   web  → Next.js frontend
#   api  → Express + WebSocket + SQLite backend
#
# Everything is served from ONE domain via Dokploy's own domain feature (path-based
# routes configured in the Dokploy UI/API: "/api" and "/ws" -> api:4000, "/" -> web:3000).
# Hand-rolled Traefik labels were removed here because they raced Dokploy's own
# Traefik-label injection on these containers and Let's Encrypt never issued a real
# cert for portfolio.udayps.com — Dokploy's managed domain path is what actually
# gets certs issued reliably on this setup.
#
# Because the API is same-origin, the frontend just uses relative "/api" and "/ws"
# (see web/src/lib/api.ts). No CORS, and NO build-time NEXT_PUBLIC_API_URL needed —
# leave it unset so API_BASE = "" (same origin).

services:
  web:
    # SAME-ORIGIN: no NEXT_PUBLIC_* build args are passed, so API_BASE="" and the
    # client talks to /api + /ws on its own origin (portfolio.udayps.com).
    # Do NOT pass NEXT_PUBLIC_API_URL / NEXT_PUBLIC_WS_URL here — a stale value (e.g.
    # wss://api.udayps.com/ws) gets inlined into the bundle at build time and breaks
    # the WebSocket. If you ever need an absolute API origin, add the args back AND
    # set the matching Dokploy env, then REBUILD (not just restart).
    build:
      context: ./web
    container_name: uday-web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    expose:
      - "3000"
    depends_on:
      - api

  api:
    build: ./api
    container_name: uday-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DB_PATH=/app/data/portfolio.db
      # same-origin ⇒ CORS not needed; kept permissive as a fallback for dev tools
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
    volumes:
      - portfolio-data:/app/data
    expose:
      - "4000"

volumes:
  portfolio-data:

# Dokploy's shared Traefik network.
networks:
  default:
    name: dokploy-network
    external: true
